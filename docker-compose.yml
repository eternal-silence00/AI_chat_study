version: "3.9"

services:
  app:
    volumes:
    - .:/app
    - fastembed_cache:/root/.cache/fastembed
    env_file:
        - .env
    build: .
    ports:
      - "8000:8000"
    depends_on:
      - redis
      - db
      - db_test
    
  redis:
    image: redis:7
    ports:
      - "6379:6379"

  db:
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  db_test:
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=ai_test
    ports:
      - "5433:5432"

volumes:
  postgres_data:
  fastembed_cache:
